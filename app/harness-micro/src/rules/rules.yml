tools_rules:
  max_extraction_file_size: 10_000 # В байтах
  max_extraction_structure_size: 1_000 # В байтах
  max_tool_result_size: 65_536 # Полная UTF-8 сериализация ToolResult
  max_code_range_lines: 200 # Максимум строк в ответе GET-CODE-RANGE
  default_graph_search_limit: 20
  max_graph_search_limit: 100
  max_graph_subgraph_depth: 5
  max_graph_subgraph_nodes: 100
  max_graph_references_limit: 100
harness_rules:
  max_tool_calls: 6 # Жёсткий максимум — 6
  max_iterations: 8 # Независимый лимит обменов с LLM
  max_start_context_size: 262_144 # UTF-8 байты всех стартовых сообщений
  max_provider_retries: 4 # Повторы transient-ответа провайдера, жёсткий максимум — 10
